# mise configuration for the journal repo.
# Autoloads .env when you cd into this directory (requires mise shell activation).
# See .env.example for the required variables.
#
# Run `mise install` (or `bash setup.sh`) to install all tools.

# ── Required tools ────────────────────────────────────────────────────────────
[tools]
node        = "lts"
gum         = "latest"
"npm:@tobilu/qmd" = "latest"
"npm:repomix"     = "latest"
"npm:context-mode" = "latest"

# ── AI Coding Agents ──────────────────────────────────────────────────────────
# setup.sh manages these interactively. Both can be installed simultaneously.
opencode    = "latest"   # CLI-based agent (https://opencode.ai/)
# claude = "latest"     # Claude Code (https://claude.ai/code)

# ── Optional integrations ─────────────────────────────────────────────────────
# setup.sh manages these interactively. To change manually: uncomment/comment
# and run `mise install`. Re-running setup.sh also works.
# gh = "latest"   # GitHub CLI
# glab = "latest"   # GitLab CLI
# "ubi:ankitpokhrel/jira-cli[exe=jira]" = "latest"   # Jira CLI
# "npm:confluence-cli" = "latest"   # Confluence CLI

# ── Environment ───────────────────────────────────────────────────────────────
[env]
_.file = { path = ".env", redact = true }

# ── Tasks ─────────────────────────────────────────────────────────────────────
[tasks.generate]
run = "bash generate.sh {{arg(name='agents', rest=true)}}"
description = "Generate agent config dirs from .shared/ (usage: mise run generate opencode)"

[tasks.update]
run = "bash generate.sh $(cat .agent-config 2>/dev/null | tr '\\n' ' ' || echo opencode)"
description = "Regenerate agent configs using saved selection from .agent-config"

[tasks.setup]
run = "bash setup.sh"
description = "Full interactive setup (agent selection, tools, env)"
